<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brike Place | Meus anuncios></title>
    <!-- Link para o seu arquivo CSS -->
    <link rel="stylesheet" href="startup.css">
    <!-- Fonte Inter (Opcional, mas recomendada para o design moderno) -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head> 

<body>

    <div class="app-container">

        <!-- HEADER / TOPO DO SITE -->
        <header class="header">
            <div class="container header__wrapper">

                <a href="startup.html" class="header__logo">
                    <img src="LOGOAJUSTADA-removebg-preview.png" alt="Logo Brike Market Place" class="header__logo-img">
                </a>

                <nav class="header__nav">
                    <ul class="header__nav-list">
                        <!-- BARRA DE PESQUISA -->
                        <li class="header__search-item">
                            <form action="#" method="GET" class="header__search-form">
                                <input type="search" name="q" placeholder="Buscar desapegos..."
                                    aria-label="Buscar produtos" class="header__search-input">
                                <button type="submit" class="header__search-btn" aria-label="Pesquisar">🔍
                                </button>
                            </form>
                        </li>

                        <li><a href="comofunc.html" class="header__nav-link">Como Funciona</a></li>
                        <div class="header__actions">
                            <a href="pgDesp.html" class="btn btn--primary">Anunciar Desapego</a>
                        </div>
            </div>
        </header>
    </div>
    </ul>
    </nav>

    <section class="container">

        <!-- CABEÇALHO DA SEÇÃO -->

        <section class="feed-section">
            <h1>Desapegos Recentes</h1>
            <p style="color: var(--color-text-muted);">Seus produtos anunciados.</p>

            <!-- GRADE DE PRODUTOS -->
            <div class="product-grid">

                <!-- CARD EXEMPLO 1 -->
                <article class="product-card">
                    <div class="product-card__image-wrapper">
                        <img src="imgfone.jpg" alt="Fone de Ouvido Bluetooth">
                    </div>
                    <div class="product-card__content">
                        <h3 class="product-card__title">Fone de Ouvido Bluetooth</h3>
                        <p class="product-card__price">R$ 150,00</p>
                        <span class="product-card__badge">Semi-novo (6 meses de uso)</span>
                    </div>
                </article>

                <!-- CARD EXEMPLO 2 -->
                <article class="product-card">
                    <div class="product-card__image-wrapper">
                        <img src="tenis" alt="Tênis Esportivo Vermelho">
                    </div>
                    <div class="product-card__content">
                        <h3 class="product-card__title">Tênis Esportivo Vermelho</h3>
                        <p class="product-card__price">R$ 180,00</p>
                        <span class="product-card__badge">Usado - Ótimo estado</span>
                    </div>
                </article>
            </div>
        </section>
         <br>
          <br>

    </div>
</main>
 <!-- RODAPÉ -->
 <footer class="footer">
    <div class="container">
        <p class="footer__text">&copy; 2026 Brike Place. Economia e desapego consciente.</p>
    </div>
</footer>

</div>
